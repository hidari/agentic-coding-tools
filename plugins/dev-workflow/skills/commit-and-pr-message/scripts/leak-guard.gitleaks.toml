# 漏洩検査の層 1 のうち custom ルール (gitleaks の config)。
# ユーザー名を含む絶対パス・UUID 形の識別子・メールアドレスのように、形は決まっているが
# gitleaks の既定ルールが見ないものを検出する。
#
# 既定ルールは同じディレクトリの leak-guard-default.gitleaks.toml が持つ。呼ぶ側は 2 本を
# それぞれ -c で渡し、1 回ずつ走らせる。
#
# ここへ [extend] useDefault = true を置かない。既定 config の全体除外 (?i)^true|false|null$ は
# 同じ config の custom ルールの検出にも効き、true で始まるメールアドレス、false を含む
# メールアドレス、false を含む・null で終わるユーザー名のパスが検出されなくなる
# (gitleaks 8.30.1 で実測。同じルールを useDefault なしの config で回すと全部検出される)。
title = "leak-guard custom rules"

# このファイル自身と、実例を literal で持ちがちな config を名前で外す。この config は
# useDefault を持たないので、既定 config にある path の除外 (パスに gitleaks.toml を
# 含むものを外す) が効かない。外さないと、下のコメントが説明のために持つ実例
# (/Users/name やアドレス) をこのファイル自身が検出する。
#
# 外す名前は 3 つだけにしてある。このファイル、既定ルールの config、gitleaks が既定で探す
# config の名前 .gitleaks.toml (配布元のリポジトリの履歴には、この名前で custom ルールを
# 置いていた版が実例ごと残り、全履歴の走査がそこに当たる)。[^/]*gitleaks\.toml$ のような
# 広い形にすると、無関係なファイルまで層 1 から隠れる。
#
# 既知の限界: regex はパスの文字列を見るだけで、ファイルとディレクトリを区別できない。
# gitleaks の dir モードでは、3 つの名前のどれかとちょうど同じ名前のディレクトリがあると、
# その配下が丸ごと走査から外れる (gitleaks 8.30.1 で実測。git モードでは外れない)。
#
# 外したファイルは層 1 の走査の外にあり、見うるのは禁止語リストの検査 (層 2) だけになる。
# ここへ書く実例は合成値か公開してよい値に限る。
[allowlist]
description = "実例を literal で持つ gitleaks の config を名前で外す"
paths = ['''(^|/)(\.gitleaks|leak-guard(-default)?\.gitleaks)\.toml$''']

# ルールは OS 別ではなく 1 本にしてある。OS で割ると、どちらの形にも当てはまらない
# 書かれ方 (UNC・ドライブ省略・エスケープ済み) が両方の網から落ちる。macOS 専用のルール
# だけでは C:\Users\<name> 形が素通りする。
[[rules]]
id = "user-path"
description = "ローカルユーザー名を含む絶対パスの漏洩 (/Users/<name> と C:\\Users\\<name> の両方)"

# 区切りは / と \ の両方を、1 個以上受ける。押さえている書かれ方:
#
#   /Users/name                        macOS
#   C:\Users\name  C:/Users/name       Windows (/ 区切りでパスを書くツールもある)
#   C:\\Users\\name                    JSON / Python repr / JS 文字列リテラル
#   \\Mac\AllFiles\Users\name          UNC。Parallels の共有フォルダは VM 側からこう見える
#   \Users\name                        ドライブ省略 (%SystemDrive%\Users\name など)
#   /mnt/c/Users/name                  WSL
#
# 区切りを 1 文字に固定すると 2 連バックスラッシュで照合が止まり、ドライブレターを
# 必須にすると UNC とドライブ省略形が落ちる。どちらも「コマンド出力を貼る」経路で
# 実際に出る形なので、区切りだけを手がかりにする。
#
# (?i) の位置が効く。ここより前は case sensitive なので、パス要素の Users は大文字 U を
# 要求したまま、ユーザー名だけを大小無視にできる。全体に (?i) を掛けると REST API の
# /api/users/<id> のような小文字パスまで拾って誤検出する (実測)。
regex = '''[\\/]+Users[\\/]+(?i)[a-z_][a-z0-9._-]*'''
tags = ["pii", "path"]

  # placeholder / 共有・CI 用のユーザー名と、Windows 自身が作るディレクトリを許可する。
  # どれも個人を指さない。Public は Windows の共有ディレクトリで、一時ファイルの置き場にも
  # 使われる。
  #
  # 境界 ([\\/."]|$) が要る。ルール本体の文字クラスが . を含むため、文末ピリオドが
  # match に取り込まれて Public$ が外れ誤検出になる (実測)。
  # All Users は空白を含むが区切り文字クラスに空白が無いので照合は All で止まる。
  [rules.allowlist]
  description = "placeholder / 共有・CI 用パスと Windows のシステム用ディレクトリは許可"
  # secret==match (capture group 無し) だが、境界判定の意図を明示するため match を指定
  regexTarget = "match"
  regexes = [
    '''[\\/]+Users[\\/]+(?i)(example|user|username|runner|shared|Public|Default|DefaultAppPool|All)([\\/."]|$)''',
  ]

# UUID 形の識別子。テストの fixture へ実機の出力 (VM の一覧など) を貼ると、実在する VM や
# デバイスの UUID がそのまま入る。形が決まっているので固有名詞リストを要さず、公開される
# 設定ファイルにルールを置ける。実在するかどうかは形からは分からないので、regex は UUID 形を
# 一律に撃ち、実在しない値は下の allowlist が値で外す。
#
# **パスで免除しない。** 露出が起きやすいのはテストの fixture なので、テストファイルを
# 免除すると最も起きやすい経路を開けたままにする。免除は値で持ち、新しい fixture を足す
# ときはここを触らせる。触る手間が「その値は公開してよいか」を一度考えさせる。
#
# **単語境界 \b を置かない。** 前後に置くと、素通りする形が 3 つある (実測)。
#
#   seed_<UUID>   `_` は単語文字なので先頭の境界が成立しない
#   <UUID>9       末尾 12 桁の直後に hex が続くと末尾の境界が成立しない
#   <UUID>z       同上。hex でない単語文字でも同じ
#
# 1 つ目は仮想の話ではなく、<接頭辞>_<UUID> は seed やリソースの命名で実際に使われる形。
# 境界を外しても免除は縮まない。免除は match 全体 (= 素の UUID) に ^...$ で掛かるので、
# 接頭辞や接尾辞が付いても fixture は fixture のまま許可される (実測)。ハイフンを持たない
# hex 列 (sha256 等) は 8-4-4-4-12 の形に合わない。
[[rules]]
id = "vm-uuid"
description = "UUID 形の識別子の漏洩 (実在する VM やデバイスのものを想定)"
regex = '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
tags = ["pii", "identifier"]

  # 大小を両方受けるのは、UUID が出力元によって大文字でも小文字でも現れ、片方だけで
  # 数えると取りこぼすため。
  #
  # **(?i) はエントリごとに独立しない。** gitleaks は allowlist の regexes を 1 本へ束ねて
  # 評価するので、先頭エントリの (?i) が後続エントリすべてへ前方に漏れる (実測: (?i) 付きを
  # 先頭に置くと (?i) 無しの後続まで大小無視になり、順序を逆にすると効かない)。どの
  # エントリの (?i) が効いているかは書いた場所では決まらないので、英字を含むエントリには
  # 全部書いて並べ替えで壊れないようにしてある (英字を持たない nil UUID には要らない)。
  [rules.allowlist]
  description = "合成 fixture と仕様上固定の値は許可"
  regexTarget = "match"
  regexes = [
    '''(?i)^aaaa1111-bbbb-4ccc-8ddd-eeee22223333$''',
    '''(?i)^ffff4444-aaaa-4bbb-8ccc-dddd55556666$''',
    '''^00000000-0000-0000-0000-000000000000$''',
  ]

# メールアドレス。gitleaks の既定ルールはメールアドレスを見ない (対照ファイルで実測)。
#
# 形だけで撃つので、メールボックスではない `user@host` 形も捕まえる。実測で確かめた
# 既知の誤検出クラスを挙げておく。
#
#   git@github.com:owner/repo.git       SSH の clone URL
#   admin@host.local / runner@box.lan   ssh の user@host
#
# 免除へ足していないのは、壊れる向きが fail-closed (検出で止まる) で目に見えるうえ、
# 内部ホスト名は禁止語リストの検査 (層 2) が扱う対象そのものだから。必要になったら
# ここへ値で足し、検出されるべき形と許可されるべき形の両方を実際に gitleaks へ通して
# 確かめること。
#
# GitHub の noreply 形 (NNN+user@users.noreply.github.com) も許可しない。login を含み、
# 個人を指すため。
[[rules]]
id = "email-address"
description = "メールアドレスの漏洩"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''
tags = ["pii", "contact"]

  # RFC 2606 と RFC 6761 が文書用・テスト用に予約したドメイン。予約された 2LD の下位
  # (mail.example.com 等) も文書中の例として現れるので覆う。
  #
  # 最後の 1 本は Anthropic の noreply アドレス。ベンダーの固定値で個人を指さず、Claude が
  # 付ける既定の帰属行 (Co-Authored-By) が持つ。許可しないと帰属行を持つ本文で検査が毎回
  # 止まり、止まる検査は迂回される。^ と $ で値そのものに限る。(?i) を付けるのは
  # vm-uuid の allowlist と同じ理由で、regexes が 1 本へ束ねて評価されるため。
  [rules.allowlist]
  description = "文書用に予約されたドメイン宛と、Anthropic の noreply アドレスは許可"
  regexTarget = "match"
  regexes = [
    '''(?i)@([A-Za-z0-9-]+\.)*example\.(com|org|net)$''',
    '''(?i)\.(test|example|invalid|localhost)$''',
    '''(?i)^noreply@anthropic\.com$''',
  ]
