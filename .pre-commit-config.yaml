# pre-commit 設定
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# セットアップ:
#   brew install pre-commit gitleaks
#   pre-commit install
#
# - gitleaks で staged 差分の secret とユーザー名パス (/Users/<name>) の漏洩を弾く。
#   既定ルールだけでは /Users/<name> は検査されないため .gitleaks.toml の custom ルールが要る。
# - claude plugin validate --strict で plugin.json の妥当性を機械検証する。
#   フィールド名を散文へ再掲しないための canonical な検証手段。
# - issue-id.py が Issue 識別子の記法を検査する。追跡ファイルとコミットメッセージで
#   surface が違うため hook を 2 本に分ける (下の該当 hook のコメントを参照)。
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# commit-msg を足すのは、コミットメッセージが追跡ファイルではなく pre-commit stage の
# 走査に入らないため。ここに書かないと `pre-commit install` が commit-msg の hook を
# 置かず、設定にはあるのに一度も発火しない形になる (実測: この行を入れる前の開発機には
# .git/hooks/commit-msg が無かった)。既にインストール済みの環境では
# `pre-commit install` の打ち直しが要る。
default_install_hook_types: [pre-commit, commit-msg]

# stages を宣言しない hook は全 stage で走るのが pre-commit の既定なので、
# commit-msg を install した途端に gitleaks も plugin validate も Python テストも
# 1 コミットで 2 回走る (実測: 些細な 1 行のコミットに 14.8 秒。うち 2 周目が約半分)。
# 既定を pre-commit へ寄せ、commit-msg で走らせたい hook だけが stages を宣言する。
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret / user-path leak guard)
        language: system
        entry: gitleaks git --staged --redact --no-banner -c .gitleaks.toml
        pass_filenames: false
        always_run: true

      # ルールの regex は読むだけでは取りこぼしも誤検出も判定できず、両方とも実際に
      # 埋め込んだ実績がある。ルール本体と対照ケースの 2 ファイルで 1 つの契約なので、
      # 発火条件も両方を見る。片側だけにすると、ケースを壊す変更が無検査で通る。
      - id: leak-guard-rules
        name: 漏洩ガードのルールを対照で検証する
        language: system
        entry: scripts/check-leak-guard-rules.py
        pass_filenames: false
        files: ^(\.gitleaks\.toml|scripts/check-leak-guard-rules\.py)$

      - id: plugin-validate
        name: claude plugin validate --strict (plugin.json の妥当性)
        language: system
        entry: scripts/validate-plugins.sh
        pass_filenames: false
        always_run: true

      - id: package-shape
        name: パッケージの形と命名規約を検査する
        language: system
        entry: scripts/check-package-shape.py
        pass_filenames: false
        always_run: true

      - id: readme-drift
        name: README が frontmatter と一致しているか検査する
        language: system
        entry: scripts/gen-readme.py --check
        pass_filenames: false
        always_run: true

      # 記法違反はどのファイルにも書けるので、走査対象は追跡ファイル全体で固定する
      # (対象集合の canonical は issue-id.py の --check)。ファイル名で絞る指定を
      # 置かないのはその宣言で、実際に走ることを保証しているのは always_run: true の方。
      # always_run があると pre-commit のファイル名フィルタは効かなくなる
      # (実測: 設定の top-level に exclude を置いてもこの hook は走った)。
      - id: issue-id-notation
        name: Issue 識別子の記法を検査する (追跡ファイル)
        language: system
        entry: plugins/dev-workflow/skills/in-repo-issue/scripts/issue-id.py --check
        pass_filenames: false
        always_run: true

      # コミットメッセージは追跡ファイルではないので --check の走査集合に入らない。
      # pre-commit は commit-msg stage で message ファイルのパスを 1 つだけ渡すので、
      # --check-text の引数として素直に流れる。
      #
      # 既知の限界: 走査対象は git が渡す message ファイルの全文で、コメント行も
      # `git commit -v` が末尾へ足す diff も含まれる (実測)。したがって -v で
      # コミットすると、diff に載っただけの数字記法 (フェンス内や .css など --check が
      # 免除している側も含む) を違反として弾く。-m と -F の経路にはこの面が無く
      # (実測: message そのものしか渡らない)、本リポの規約は -F なので既定では踏まない。
      # 潰すには git の cleanup 規則 (コメント行の除去と scissors 行以降の切り落とし) を
      # hook 側で再実装することになり、二重管理と引き換えになるため採っていない。
      #
      # always_run: true を置くのは、この stage では絞り込みが「絞る」ではなく
      # 「常に skip」になるため。渡るファイルが message ファイル 1 本しかないので、
      # ファイル名やファイル型で絞る指定は (hook 側でも設定の top-level でも) 集合を
      # 空にする。always_run が無いと空集合は "(no files to check)Skipped" の rc 0 で
      # 返り、裸の数字記法を含むメッセージがそのままコミットできた (実測)。always_run が
      # あれば同じ変異は引数ゼロの argparse エラー (exit 2) になり、静かには素通りしない
      # (実測)。stage 宣言があるので通常の pre-commit stage では走らない (実測)。
      - id: issue-id-notation-commit-msg
        name: Issue 識別子の記法を検査する (コミットメッセージ)
        language: system
        entry: plugins/dev-workflow/skills/in-repo-issue/scripts/issue-id.py --check-text
        stages: [commit-msg]
        always_run: true

      # 走査対象は git の pathspec で固定するので files: で絞らない。Issue を触らない
      # コミットでも走らせるのは、baseline とリンクの実態のずれを次に Issue を触るまで
      # 隠さないため。絞ると「走らなかったこと」自体が出力に現れなくなる。
      # 規約そのものの canonical は dev-workflow:in-repo-issue skill で、識別子記法の
      # canonical は上の issue-id.py。この検査はどちらも再掲せず借りている。
      - id: related-refs
        name: 関連節の Issue 参照を検査する (識別子の実在とリンク baseline)
        language: system
        entry: scripts/check-related-refs.py
        pass_filenames: false
        always_run: true

      # 上の 2 本が記法と参照を見るのに対し、これはライフサイクルの状態を見る。
      # 母集団は issue-id.py の issue_dirs を借りるので pass_filenames は取らない。
      - id: issue-closure
        name: 閉じ忘れと配置と status の整合を検査する
        language: system
        entry: scripts/check-issue-closure.py
        pass_filenames: false
        always_run: true

      # 捕捉するのは「CLAUDE.md の上書きが効かず、成果物が上流 skill の既定パスへ落ちる」
      # 失敗モードだけ。Issue ディレクトリ配下に置かれたファイルの名前違反 (識別子の無い
      # spec.md、別 Issue の識別子を前置したファイル) は見ない。ディレクトリ名から識別子を
      # 抽出するリポジトリ固有のロジックが要るためで、規約の canonical は
      # dev-workflow:issue-scoped-artifacts skill が持つ。
      #
      # language: fail なのは環境構築を伴わせないため。実行可能スクリプトを配る方式は
      # plugin の実体パスをシェルから解決できないので採れない (理由の canonical も同 skill)。
      - id: issue-scoped-artifacts
        name: spec と plan は Issue ディレクトリ配下へ置く
        language: fail
        entry: "この成果物は docs/issues/<ID>_<title>/<ID>-spec.md または <ID>-plan.md へ置く"
        files: '^docs/superpowers/(plans|specs)/'

      - id: python-tests
        name: Python テスト (stdlib unittest)
        language: system
        entry: scripts/run-python-tests.py
        pass_filenames: false
        always_run: true
