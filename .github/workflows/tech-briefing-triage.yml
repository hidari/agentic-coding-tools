{
  "name": "tech-briefing-triage",
  "on": {
    "workflow_call": {
      "inputs": {
        "config-path": {
          "description": "設定のファイルのパス (呼び出し側のリポジトリの root から)",
          "type": "string",
          "required": true
        },
        "dry-run": {
          "description": "真なら投稿せず、本文を step summary に出す",
          "type": "boolean",
          "default": true
        },
        "runner": {
          "description": "runs-on のラベル",
          "type": "string",
          "default": "ubuntu-24.04"
        }
      },
      "secrets": {
        "ANTHROPIC_API_KEY": {
          "required": true
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "${{ github.repository }}-tech-briefing-triage",
    "cancel-in-progress": false
  },
  "jobs": {
    "select": {
      "runs-on": "${{ inputs.runner }}",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "issues": "read"
      },
      "outputs": {
        "result": "${{ steps.select.outputs.result }}"
      },
      "steps": [
        {
          "name": "共通の仕組みの repository と SHA が届いているか確かめる",
          "env": {
            "TB_WORKFLOW_REPOSITORY": "${{ job.workflow_repository }}",
            "TB_WORKFLOW_SHA": "${{ job.workflow_sha }}"
          },
          "run": "if [ -z \"$TB_WORKFLOW_REPOSITORY\" ] || [ -z \"$TB_WORKFLOW_SHA\" ]; then echo \"::error::job.workflow_repository か job.workflow_sha が空です\"; exit 1; fi"
        },
        {
          "name": "共通の仕組みを呼ばれた SHA で checkout する",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "repository": "${{ job.workflow_repository }}",
            "ref": "${{ job.workflow_sha }}",
            "path": "tech-briefing-shared",
            "persist-credentials": false
          }
        },
        {
          "name": "呼び出し側のリポジトリを checkout する",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "path": "caller",
            "persist-credentials": false
          }
        },
        {
          "name": "uv を入れる",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.4",
            "enable-cache": false
          }
        },
        {
          "name": "select を走らせる",
          "id": "select",
          "working-directory": "tech-briefing-shared",
          "env": {
            "TB_REPOSITORY": "${{ github.repository }}",
            "TB_OUT_DIR": "${{ runner.temp }}/tech-briefing",
            "GITHUB_TOKEN": "${{ github.token }}",
            "TB_CONFIG_PATH": "${{ inputs.config-path }}",
            "TB_AUTHOR": "${{ vars.TECH_BRIEFING_AUTHOR }}",
            "TB_CALLER_DIR": "${{ github.workspace }}/caller",
            "TB_CALLER_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "TB_WORKFLOW_REPOSITORY": "${{ job.workflow_repository }}",
            "TB_WORKFLOW_SHA": "${{ job.workflow_sha }}"
          },
          "run": "uv run --script tech-briefing/bin/run_select.py"
        },
        {
          "name": "入力を渡す",
          "if": "steps.select.outputs.result == 'triage' || steps.select.outputs.result == 'unexpected' || steps.select.outputs.result == 'input-too-large'",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "tech-briefing-select",
            "path": "${{ runner.temp }}/tech-briefing/input.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "triage": {
      "needs": [
        "select"
      ],
      "if": "needs.select.outputs.result == 'triage'",
      "runs-on": "${{ inputs.runner }}",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read"
      },
      "environment": "tech-briefing",
      "steps": [
        {
          "name": "共通の仕組みの repository と SHA が届いているか確かめる",
          "env": {
            "TB_WORKFLOW_REPOSITORY": "${{ job.workflow_repository }}",
            "TB_WORKFLOW_SHA": "${{ job.workflow_sha }}"
          },
          "run": "if [ -z \"$TB_WORKFLOW_REPOSITORY\" ] || [ -z \"$TB_WORKFLOW_SHA\" ]; then echo \"::error::job.workflow_repository か job.workflow_sha が空です\"; exit 1; fi"
        },
        {
          "name": "共通の仕組みを呼ばれた SHA で checkout する",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "repository": "${{ job.workflow_repository }}",
            "ref": "${{ job.workflow_sha }}",
            "path": "tech-briefing-shared",
            "persist-credentials": false
          }
        },
        {
          "name": "呼び出し側のリポジトリを checkout する",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "path": "caller",
            "persist-credentials": false
          }
        },
        {
          "name": "uv を入れる",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.4",
            "enable-cache": false
          }
        },
        {
          "name": "入力を受け取る",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "tech-briefing-select",
            "path": "${{ runner.temp }}/tech-briefing"
          }
        },
        {
          "name": "triage を走らせる",
          "id": "triage",
          "working-directory": "tech-briefing-shared",
          "env": {
            "TB_REPOSITORY": "${{ github.repository }}",
            "TB_OUT_DIR": "${{ runner.temp }}/tech-briefing",
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "TB_CONFIG_PATH": "${{ inputs.config-path }}",
            "TB_CALLER_DIR": "${{ github.workspace }}/caller"
          },
          "run": "uv run --script tech-briefing/bin/run_triage.py"
        },
        {
          "name": "報告を渡す",
          "if": "!cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "tech-briefing-triage",
            "path": "${{ runner.temp }}/tech-briefing/report.json\n${{ runner.temp }}/tech-briefing/failure.json\n${{ runner.temp }}/tech-briefing/tool-log.json",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ]
    },
    "post": {
      "needs": [
        "select",
        "triage"
      ],
      "if": "always() && needs.select.result == 'success' && (needs.select.outputs.result == 'triage' || needs.select.outputs.result == 'unexpected' || needs.select.outputs.result == 'input-too-large') && needs.triage.result != 'cancelled'",
      "runs-on": "${{ inputs.runner }}",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "issues": "write"
      },
      "steps": [
        {
          "name": "共通の仕組みの repository と SHA が届いているか確かめる",
          "env": {
            "TB_WORKFLOW_REPOSITORY": "${{ job.workflow_repository }}",
            "TB_WORKFLOW_SHA": "${{ job.workflow_sha }}"
          },
          "run": "if [ -z \"$TB_WORKFLOW_REPOSITORY\" ] || [ -z \"$TB_WORKFLOW_SHA\" ]; then echo \"::error::job.workflow_repository か job.workflow_sha が空です\"; exit 1; fi"
        },
        {
          "name": "共通の仕組みを呼ばれた SHA で checkout する",
          "uses": "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0",
          "with": {
            "repository": "${{ job.workflow_repository }}",
            "ref": "${{ job.workflow_sha }}",
            "path": "tech-briefing-shared",
            "persist-credentials": false
          }
        },
        {
          "name": "uv を入れる",
          "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2",
          "with": {
            "version": "0.13.4",
            "enable-cache": false
          }
        },
        {
          "name": "入力を受け取る",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "tech-briefing-select",
            "path": "${{ runner.temp }}/tech-briefing"
          }
        },
        {
          "name": "報告を受け取る",
          "if": "needs.triage.result != 'skipped'",
          "continue-on-error": true,
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "tech-briefing-triage",
            "path": "${{ runner.temp }}/tech-briefing"
          }
        },
        {
          "name": "post を走らせる",
          "id": "post",
          "working-directory": "tech-briefing-shared",
          "env": {
            "TB_REPOSITORY": "${{ github.repository }}",
            "TB_OUT_DIR": "${{ runner.temp }}/tech-briefing",
            "GITHUB_TOKEN": "${{ github.token }}",
            "TB_DRY_RUN": "${{ inputs.dry-run }}",
            "TB_AUTHOR": "${{ vars.TECH_BRIEFING_AUTHOR }}",
            "TB_SELECT_RESULT": "${{ needs.select.outputs.result }}",
            "TB_TRIAGE_RESULT": "${{ needs.triage.result }}"
          },
          "run": "uv run --script tech-briefing/bin/run_post.py"
        }
      ]
    }
  }
}
