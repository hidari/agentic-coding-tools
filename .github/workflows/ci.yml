name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    name: gitleaks (leak guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          gitleaks_version="8.30.1" # 開発機と揃える
          # sha256 は展開前に内容を pin する堰。
          # 再計算方法: curl で同じ URL を取得し sha256sum gitleaks_8.30.1_linux_x64.tar.gz を実行する。
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          "$GITHUB_WORKSPACE/scripts/ci/download-and-verify.sh" "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" "$expected_sha256" "$archive"
          tar -xz -C "$RUNNER_TEMP" -f "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # ルール自身が正しいかを先に見る。ここが壊れていると、次の全履歴走査は
      # 「壊れたガードで緑」を出す。pre-commit にも同じ検査を置いてあるが、
      # -n での skip や pre-commit 未導入の経路があるので防御を 1 層にしない。
      - name: Verify leak guard rules
        run: python3 scripts/check-leak-guard-rules.py

      # 履歴は本リポジトリで新規に作るため、範囲を絞らず全履歴を走査する。
      # 既定ルールだけでは /Users/<name> は検査されないので -c で custom ルールを渡す。
      - name: Scan full history for leaks
        run: gitleaks git --redact --no-banner -c .gitleaks.toml

  package-shape:
    name: パッケージの形と命名規約
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # runner の python3 を使う。スクリプトは標準ライブラリのみで、
      # setup-python を足すと pin すべき依存が 1 つ増えるため入れない。
      - run: python3 scripts/check-package-shape.py

      # 新 job を作らずこの job へ相乗りさせている。runner を 1 つ増やすと CI コストが
      # 上がり、job 名を変えると required status checks が壊れるため。結果として job 名
      # (パッケージの形と命名規約) はこの step を覆えていないので、step に明示の name を
      # 置いて失敗時の表示だけでも実態を名乗らせる。
      # --check は index と作業ツリーしか見ないので checkout の既定 (fetch-depth 1) で
      # 足りる。実測: depth 1 の clone と全履歴の clone で走査ファイル数が一致した。
      # コミットメッセージを見る --check-text は CI にその surface が無いので置かない
      # (pre-commit の commit-msg stage が持つ)。
      - name: Issue 識別子の記法を検査する
        run: python3 plugins/dev-workflow/skills/in-repo-issue/scripts/issue-id.py --check

      # 上と同じ理由でこの job へ相乗りさせている (新 job は runner を 1 つ増やす)。
      # 走査は index と作業ツリーだけを見るので checkout の既定 (fetch-depth 1) で足りる。
      # pre-commit にも同じ検査を置いてあるが、-n での skip や pre-commit 未導入の
      # 経路があるので防御を 1 層にしない。
      - name: 関連節の Issue 参照を検査する
        run: python3 scripts/check-related-refs.py

      # 同じ理由でこの job へ相乗りさせている。この検査も index と作業ツリーだけを
      # 見るので checkout の既定 (fetch-depth 1) で足りる。
      - name: in-repo Issue の不変条件を検査する
        run: python3 scripts/check-issue-closure.py

  readme-drift:
    name: README の drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: python3 scripts/gen-readme.py --check

  python-tests:
    name: Python テスト (stdlib unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: python3 scripts/run-python-tests.py
