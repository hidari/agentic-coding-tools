# gitleaks 設定
# 既定の secret 検出ルールを継承しつつ、ローカルユーザー名を含む絶対パスの漏洩を
# 検出する custom ルールを追加する。pre-commit (staged 検査) と CI (全履歴) の双方が
# 本設定を使用する。既定ルールだけではユーザー名を含むパスは検査されない。
#
# ルールは OS 別ではなく 1 本にしてある。OS で割ると、どちらの形にも当てはまらない
# 書かれ方 (UNC・ドライブ省略・エスケープ済み) が両方の網から落ちるため。
# 実際に macOS 専用ルールしか無かった時期に C:\Users\<name> が素通りして履歴へ入った。
title = "agentic-coding-tools gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "user-path"
description = "ローカルユーザー名を含む絶対パスの漏洩 (/Users/<name> と C:\\Users\\<name> の両方)"

# 区切りは / と \ の両方を、1 個以上受ける。押さえている書かれ方:
#
#   /Users/name                        macOS
#   C:\Users\name  C:/Users/name       Windows (winvm はリモートパスを / で書く経路を持つ)
#   C:\\Users\\name                    JSON / Python repr / JS 文字列リテラル
#   \\Mac\AllFiles\Users\name          UNC。Parallels の共有フォルダは VM 側からこう見える
#   \Users\name                        ドライブ省略 (%SystemDrive%\Users\name など)
#   /mnt/c/Users/name                  WSL
#
# 区切りを 1 文字に固定すると 2 連バックスラッシュで照合が止まり、ドライブレターを
# 必須にすると UNC とドライブ省略形が落ちる。どちらも「コマンド出力を貼る」経路で
# 実際に出る形なので、区切りだけを手がかりにする。
#
# (?i) の位置が効く。ここより前は case sensitive なので、パス要素の Users は大文字 U を
# 要求したまま、ユーザー名だけを大小無視にできる。全体に (?i) を掛けると REST API の
# /api/users/<id> のような小文字パスまで拾って誤検出する (実測)。
regex = '''[\\/]+Users[\\/]+(?i)[a-z_][a-z0-9._-]*'''
tags = ["pii", "path"]

  # placeholder / 共有・CI 用のユーザー名と、Windows 自身のディレクトリを許可する。
  # Public は winvm が一時 .ps1 の置き場に使っているので、許可しないとソースと
  # テストが全部引っかかる。
  #
  # 境界 ([\\/."]|$) が要る。ルール本体の文字クラスが . を含むため、文末ピリオドが
  # match に取り込まれて Public$ が外れ誤検出になる (実測)。
  # All Users は空白を含むが区切り文字クラスに空白が無いので照合は All で止まる。
  [rules.allowlist]
  description = "placeholder / 共有・CI 用パスと Windows のシステム用ディレクトリは許可"
  # secret==match (capture group 無し) だが、境界判定の意図を明示するため match を指定
  regexTarget = "match"
  regexes = [
    '''[\\/]+Users[\\/]+(?i)(example|user|username|runner|shared|Public|Default|DefaultAppPool|All)([\\/."]|$)''',
  ]

# UUID 形の識別子。ISSUE-15 のスイープで開発機に実在する VM の UUID が 2 件、テストの
# fixture の中から出た。形が決まっているので固有名詞リストを要さず、この PUBLIC な設定
# ファイルにルールを置ける。実在するかどうかは形からは分からないので、regex は UUID 形を
# 一律に撃ち、実在しない値は下の allowlist が値で外す。
#
# **パスで免除しない。** 露出は test_winvm.py の中で起きたので、テストファイルを免除すると
# 見つけた穴をそのまま作り直すことになる。免除は値で持ち、新しい fixture を足すときは
# ここを触らせる。触る手間が「その値は公開してよいか」を一度考えさせる。
#
# **単語境界 \b を置かない。** 当初は前後に置いていたが、素通りする形が 3 つあった (実測)。
#
#   seed_<UUID>   `_` は単語文字なので先頭の境界が成立しない
#   <UUID>9       末尾 12 桁の直後に hex が続くと末尾の境界が成立しない
#   <UUID>z       同上。hex でない単語文字でも同じ
#
# 1 つ目は仮想の話ではなく、security-blue-red-team plugin が `security_redteam_<UUID>` を
# seed の既定形式として文書化している。境界を外しても免除は縮まない。免除は match 全体
# (= 素の UUID) に ^...$ で掛かるので、接頭辞や接尾辞が付いても fixture は fixture のまま
# 許可される (実測)。ハイフンを持たない hex 列 (sha256 等) は 8-4-4-4-12 の形に合わない。
[[rules]]
id = "vm-uuid"
description = "UUID 形の識別子の漏洩 (実在する VM やデバイスのものを想定)"
regex = '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
tags = ["pii", "identifier"]

  # 大小を両方受けるのは、小文字だけで数えて取りこぼした実績が 2 度あるため
  # (ISSUE-15 の「大文字小文字を無視した再計測」と、それを書いている最中の sed)。
  #
  # **(?i) はエントリごとに独立しない。** gitleaks は allowlist の regexes を 1 本へ束ねて
  # 評価するので、先頭エントリの (?i) が後続エントリすべてへ前方に漏れる (実測: (?i) 付きを
  # 先頭に置くと (?i) 無しの後続まで大小無視になり、順序を逆にすると効かない)。どの
  # エントリの (?i) が効いているかは書いた場所では決まらないので、全エントリに書いて
  # 並べ替えで壊れないようにしてある。1 つ消したときに何が起きるかは対照ケースが決める。
  [rules.allowlist]
  description = "合成 fixture と仕様上固定の値は許可"
  regexTarget = "match"
  regexes = [
    '''(?i)^aaaa1111-bbbb-4ccc-8ddd-eeee22223333$''',
    '''(?i)^ffff4444-aaaa-4bbb-8ccc-dddd55556666$''',
    '''^00000000-0000-0000-0000-000000000000$''',
  ]

# メールアドレス。CLAUDE.md が MUST で禁じているのに、既定ルールも user-path も 1 件も
# 見ていなかった (対照ファイルで実測)。
#
# 形だけで撃つので、メールボックスではない `user@host` 形も捕まえる。実測で確かめた
# 既知の誤検出クラスを挙げておく。いずれも現在の追跡ツリーには 1 件も無い。
#
# ここへ実物の形を literal で書けるのは、gitleaks が `.gitleaks.toml` という名前の
# ファイルを走査対象から外すため (実測: 別名へコピーすると同じ内容が 12 件検出される)。
# 上の user-path ルールの説明にある `/Users/name` も同じ理由で書けている。
# 対照ケース側 (scripts/check-leak-guard-rules.py) にはこの免除が無いので、
# あちらでは値を変数から組み立てること。
#
#   git@github.com:owner/repo.git       SSH の clone URL
#   admin@host.local / runner@box.lan   ssh の user@host
#   NNN+user@users.noreply.github.com   GitHub の noreply 形
#
# 免除へ足していないのは、壊れる向きが fail-closed (コミットが止まる) で目に見えるうえ、
# 内部ホスト名は層 2 が扱う対象そのものだから。必要になったらここへ値で足し、対照も
# 同時に足すこと。値を足さずに `--no-verify` で回すと、この層だけでなく全層が飛ぶ。
[[rules]]
id = "email-address"
description = "メールアドレスの漏洩"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''
tags = ["pii", "contact"]

  # RFC 2606 と RFC 6761 が文書用・テスト用に予約したドメイン。予約された 2LD の下位
  # (mail.example.com 等) も文書中の例として現れるので覆う。覆っている範囲の canonical は
  # 対照ケース (scripts/check-leak-guard-rules.py) で、件数はここへ書かない。
  [rules.allowlist]
  description = "文書用に予約されたドメイン宛は許可"
  regexTarget = "match"
  regexes = [
    '''(?i)@([A-Za-z0-9-]+\.)*example\.(com|org|net)$''',
    '''(?i)\.(test|example|invalid|localhost)$''',
  ]
