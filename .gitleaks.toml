# gitleaks 設定
# 既定の secret 検出ルールを継承しつつ、ローカルユーザー名を含む絶対パスの漏洩を
# 検出する custom ルールを追加する。pre-commit (staged 検査) と CI (全履歴) の双方が
# 本設定を使用する。既定ルールだけではユーザー名を含むパスは検査されない。
#
# ルールは OS 別ではなく 1 本にしてある。OS で割ると、どちらの形にも当てはまらない
# 書かれ方 (UNC・ドライブ省略・エスケープ済み) が両方の網から落ちるため。
# 実際に macOS 専用ルールしか無かった時期に C:\Users\<name> が素通りして履歴へ入った。
title = "agentic-coding-tools gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "user-path"
description = "ローカルユーザー名を含む絶対パスの漏洩 (/Users/<name> と C:\\Users\\<name> の両方)"

# 区切りは / と \ の両方を、1 個以上受ける。押さえている書かれ方:
#
#   /Users/name                        macOS
#   C:\Users\name  C:/Users/name       Windows (winvm はリモートパスを / で書く経路を持つ)
#   C:\\Users\\name                    JSON / Python repr / JS 文字列リテラル
#   \\Mac\AllFiles\Users\name          UNC。Parallels の共有フォルダは VM 側からこう見える
#   \Users\name                        ドライブ省略 (%SystemDrive%\Users\name など)
#   /mnt/c/Users/name                  WSL
#
# 区切りを 1 文字に固定すると 2 連バックスラッシュで照合が止まり、ドライブレターを
# 必須にすると UNC とドライブ省略形が落ちる。どちらも「コマンド出力を貼る」経路で
# 実際に出る形なので、区切りだけを手がかりにする。
#
# (?i) の位置が効く。ここより前は case sensitive なので、パス要素の Users は大文字 U を
# 要求したまま、ユーザー名だけを大小無視にできる。全体に (?i) を掛けると REST API の
# /api/users/<id> のような小文字パスまで拾って誤検出する (実測)。
regex = '''[\\/]+Users[\\/]+(?i)[a-z_][a-z0-9._-]*'''
tags = ["pii", "path"]

  # placeholder / 共有・CI 用のユーザー名と、Windows 自身のディレクトリを許可する。
  # Public は winvm が一時 .ps1 の置き場に使っているので、許可しないとソースと
  # テストが全部引っかかる。
  #
  # 境界 ([\\/."]|$) が要る。ルール本体の文字クラスが . を含むため、文末ピリオドが
  # match に取り込まれて Public$ が外れ誤検出になる (実測)。
  # All Users は空白を含むが区切り文字クラスに空白が無いので照合は All で止まる。
  [rules.allowlist]
  description = "placeholder / 共有・CI 用パスと Windows のシステム用ディレクトリは許可"
  # secret==match (capture group 無し) だが、境界判定の意図を明示するため match を指定
  regexTarget = "match"
  regexes = [
    '''[\\/]+Users[\\/]+(?i)(example|user|username|runner|shared|Public|Default|DefaultAppPool|All)([\\/."]|$)''',
  ]
